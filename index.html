<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="夜市風夾娃娃：搖桿移爪、下爪抓絨玩偶，略帶喜劇失手。純前端 Playgrounds SAM。"
    />
    <title>夾娃娃</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>夾娃娃</h1>
        <p class="tagline">夜市機台 · 技巧＋運氣 · 純娛樂</p>
      </header>

      <section class="meter" aria-label="機台狀態">
        <div class="meter-item">
          <span class="label">代幣</span>
          <strong id="credits">5</strong>
        </div>
        <div class="meter-item">
          <span class="label">分數</span>
          <strong id="score">0</strong>
        </div>
        <div class="meter-item">
          <span class="label">獎品</span>
          <strong id="prizes">0</strong>
        </div>
        <div class="meter-actions">
          <button type="button" id="btn-mute" class="secondary" aria-pressed="true">
            音效開
          </button>
        </div>
      </section>

      <div class="stage">
        <canvas
          id="game"
          width="480"
          height="640"
          role="img"
          aria-label="夾娃娃機台畫面"
        ></canvas>
      </div>

      <p id="status" class="status" role="status">投幣開台，對準再下爪</p>

      <div class="pad" aria-label="機台操作">
        <button type="button" id="btn-left" class="pad-btn" aria-label="爪子向左">
          ←
        </button>
        <button type="button" id="btn-drop" class="pad-drop" aria-label="下爪">
          下爪
        </button>
        <button type="button" id="btn-right" class="pad-btn" aria-label="爪子向右">
          →
        </button>
      </div>

      <div class="controls">
        <button type="button" id="btn-start">開台</button>
        <button type="button" id="btn-coin" class="secondary">投幣 +3</button>
        <button type="button" id="btn-reset" class="secondary">重來</button>
      </div>

      <p class="hint">
        左右移動爪子（按住按鈕、拖曳畫面或鍵盤 ← →），對準絨玩偶後按「下爪」。
        對得越準越容易夾到，但仍會喜劇失手——近在咫尺也常滑掉。致敬夾娃娃機玩法，非任一商業作品復刻。
      </p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
